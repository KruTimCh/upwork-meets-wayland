name: Compositor / distro test report
description: Report whether the fix works on your Wayland setup (success or failure both help)
title: "[report] <distro> + <compositor>"
labels: ["compat-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Please redact anything private. Screenshots are not needed, only the text output below.
  - type: input
    id: system
    attributes:
      label: Distro, desktop and compositor
      placeholder: "Fedora 43, GNOME 49 (Mutter) / Arch, Hyprland 0.5x / Ubuntu 24.04, KDE Plasma 6.x"
    validations: {required: true}
  - type: input
    id: upwork
    attributes:
      label: Upwork app version
      placeholder: "5.8.0-35 (Help > About, or dpkg -l upwork)"
    validations: {required: true}
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works (real screenshot in the tracker / Work Diary)
        - Works in active-screen mode only
        - Black or missing screenshots
        - App crashes or window is black
        - Installer failed
    validations: {required: true}
  - type: textarea
    id: test
    attributes:
      label: Output of ~/.local/bin/uwsnap.py --test
      render: text
    validations: {required: true}
  - type: textarea
    id: log
    attributes:
      label: Last lines of /tmp/uwsnap.log after one snap
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else (multi-monitor layout, scaling, install errors)
