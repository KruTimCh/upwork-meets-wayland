<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Upwork meets Wayland">
  <defs>
    <radialGradient id="glow" cx="22%" cy="45%" r="60%">
      <stop offset="0" stop-color="#D9A15B" stop-opacity=".22"/>
      <stop offset="1" stop-color="#020309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A15B"/>
      <stop offset="1" stop-color="#557559"/>
    </linearGradient>
    <clipPath id="screen"><rect x="118" y="142" width="276" height="188" rx="14"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="#020309"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- mark, scaled -->
  <g transform="translate(70,100) scale(0.85)">
    <rect width="512" height="512" rx="104" fill="#0b0c14"/>
    <rect x="3" y="3" width="506" height="506" rx="101" fill="none" stroke="#D9A15B" stroke-opacity=".35" stroke-width="3"/>
    <rect x="118" y="142" width="276" height="188" rx="14" fill="#000"/>
    <g clip-path="url(#screen)">
      <path d="M262 142 C306 172 218 200 262 236 C306 272 218 300 262 330 L394 330 L394 142 Z" fill="url(#lit)"/>
      <path d="M262 142 C306 172 218 200 262 236 C306 272 218 300 262 330" fill="none" stroke="#F4E3C4" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    </g>
    <path d="M322 270 L346 232 L370 270 M346 240 V294" fill="none" stroke="#020309" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="106" y="130" width="300" height="212" rx="22" fill="none" stroke="#D9A15B" stroke-width="14"/>
    <path d="M256 352 V386 M196 394 H316" fill="none" stroke="#D9A15B" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g font-family="Noto Sans, DejaVu Sans, sans-serif">
    <text x="560" y="262" font-size="84" font-weight="700" fill="#F4EFE6">Upwork meets</text>
    <text x="560" y="352" font-size="84" font-weight="700" fill="#D9A15B">Wayland</text>
    <text x="562" y="416" font-size="28" fill="#C9C4BA">Real screenshots for the Upwork tracker on Linux.</text>
    <text x="562" y="458" font-size="26" fill="#8FB08F">No more black frames. No more "switch to Xorg".</text>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#020309" font-weight="700">
    <rect x="562" y="500" width="96" height="44" rx="22" fill="#D9A15B"/><text x="584" y="531">KDE</text>
    <rect x="672" y="500" width="132" height="44" rx="22" fill="#D9A15B"/><text x="694" y="531">GNOME</text>
    <rect x="818" y="500" width="100" height="44" rx="22" fill="#D9A15B"/><text x="840" y="531">Sway</text>
    <rect x="932" y="500" width="152" height="44" rx="22" fill="#D9A15B"/><text x="954" y="531">Hyprland</text>
    <rect x="1098" y="500" width="130" height="44" rx="22" fill="#557559"/><text x="1118" y="531" fill="#F4EFE6">COSMIC</text>
  </g>
